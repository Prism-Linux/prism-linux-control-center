name: Debian packages

on:
  workflow_call:
    inputs:
      ref:
        description: Exact release commit or tag to package
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or tag to build (artifacts only; never publishes)
        required: true
        default: main
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            distribution: ubuntu24.04
          - image: ubuntu:26.04
            distribution: ubuntu26.04
          - image: debian:13
            distribution: debian13
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install checkout prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
      - name: Install package build dependencies
        run: bash packaging/debian/install-build-deps.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build and inspect package
        run: |
          bash packaging/debian/test-startup-links.sh
          bash packaging/debian/test-postinst.sh
          bash packaging/debian/build.sh "$GITHUB_WORKSPACE/artifacts"
      - name: Download and verify matching 1.2.4 upgrade package
        run: |
          old_package="lian-li-linux_1.2.4+${{ matrix.distribution }}_amd64.deb"
          encoded="lian-li-linux_1.2.4%2B${{ matrix.distribution }}_amd64.deb"
          curl --fail --location --retry 3 \
            "https://github.com/sgtaziz/lian-li-linux/releases/download/v1.2.4/${encoded}" \
            --output "$old_package"
          curl --fail --location --retry 3 \
            "https://github.com/sgtaziz/lian-li-linux/releases/download/v1.2.4/SHA256SUMS" \
            --output SHA256SUMS-1.2.4
          grep -F "  ./${old_package}" SHA256SUMS-1.2.4 | sha256sum --check
          printf 'old_package=%s\n' "$old_package" >> "$GITHUB_ENV"
      - name: Check installation without systemd running
        run: PRISM_124_PACKAGE="$old_package" bash packaging/debian/smoke-install.sh artifacts/*.deb
      - uses: actions/upload-artifact@v6
        with:
          name: deb-${{ matrix.distribution }}-amd64
          path: |
            artifacts/*.deb
            artifacts/*.buildinfo
            artifacts/*.changes
          if-no-files-found: error
