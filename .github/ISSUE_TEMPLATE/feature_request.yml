name: Feature request
description: Suggest a focused improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Search existing issues first and describe the user need without including private system data.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What task or limitation should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the change from a user's point of view.
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware and software context
      description: Include relevant device model, connection, distribution, and version. Redact serials and personal data.
